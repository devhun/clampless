name: Build and Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Universal app
        run: |
          VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      - name: Package
        run: |
          mkdir -p dist
          ZIP="dist/Clampless-${GITHUB_REF_NAME}-macos-universal.zip"
          # ditto 로 압축해야 번들 구조와 서명이 보존됨
          ditto -c -k --sequesterRsrc --keepParent build/Clampless.app "$ZIP"
          cd dist
          shasum -a 256 Clampless-*.zip > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/Clampless-*.zip
            dist/checksums.txt
